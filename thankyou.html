<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Received — Kevi Wise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--navy:#0D1F3C;--green:#059142;--cream:#FAF7F2;--muted:#6B7080;--border:#DDD8CE;--white:#FFFFFF;}
body{font-family:'Inter',sans-serif;color:var(--navy);background:var(--cream);min-height:100vh;display:flex;flex-direction:column;}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 5%;border-bottom:0.5px solid var(--border);background:var(--white);}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--navy);text-decoration:none;}
.nav-logo span{color:var(--green);}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:80px 5%;}
.card{background:var(--white);border-radius:12px;padding:64px 48px;max-width:560px;width:100%;text-align:center;box-shadow:0 4px 32px rgba(13,31,60,0.06);}
.icon{font-size:64px;margin-bottom:24px;display:block;}
h1{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:700;color:var(--navy);margin-bottom:14px;line-height:1.15;}
p{font-size:17px;color:var(--muted);line-height:1.75;margin-bottom:32px;}
.actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.btn-primary{background:var(--green);color:#fff;padding:14px 28px;border-radius:4px;font-size:15px;font-weight:500;text-decoration:none;transition:background 0.2s;}
.btn-primary:hover{background:#047535;}
.btn-outline{background:transparent;color:var(--navy);padding:13px 24px;border-radius:4px;font-size:15px;font-weight:500;text-decoration:none;border:1.5px solid var(--navy);transition:all 0.2s;}
.btn-outline:hover{background:var(--navy);color:#fff;}
.tagline{margin-top:40px;font-family:'Cormorant Garamond',serif;font-size:16px;font-style:italic;color:var(--green);}
footer{background:var(--navy);color:rgba(255,255,255,0.45);padding:24px 5%;text-align:center;font-size:13px;}
footer a{color:rgba(255,255,255,0.45);text-decoration:none;}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Kevi<span>Wise</span></a>
</nav>

<div class="main">
  <div class="card">
    <span class="icon">✅</span>
    <h1>Message received.</h1>
    <p>Thank you for getting in touch. Kevi or the team will get back to you within one business day at the email address you provided.</p>
    <div class="actions">
      <a href="guides.html" class="btn-primary">Browse the guides</a>
      <a href="contact.html" class="btn-outline">Send another message</a>
    </div>
    <p class="tagline">Wisdom lived · Honestly shared</p>
  </div>
</div>

<footer>
  <p>&copy; 2026 Kevi Wise. All rights reserved. &nbsp;·&nbsp; <a href="mailto:hello@keviwise.com">hello@keviwise.com</a></p>
</footer>

</body>
</html>
